name: DCN Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Phase 1 (single node)
      run: python tests/test_phase1.py

    - name: Run Phase 2 (2-node routing)
      run: python tests/test_phase2.py

    - name: Run Phase 3 (multi-node collaboration)
      run: python tests/test_phase3.py

    - name: Run custom node example
      run: python examples/custom_node.py
